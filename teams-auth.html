<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Masuk ke WiCon</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <!--
      Jendela login untuk WiCon di Microsoft Teams. Dibuka oleh tab Teams (src/auth/teams.ts),
      memanggil MSAL loginRedirect, memberi kabar hasilnya ke tab, lalu menutup diri.
      Entri Vite terpisah (lihat vite.config.ts); skrip modul di bawah dibundel menjadi berkas
      di /assets saat build, jadi tetap lolos CSP script-src 'self'.
    -->
    <style>
      :root { color-scheme: light dark; --latar: #f8fafc; --kartu: #ffffff; --teks: #0f172a; --redup: #64748b; --garis: #e2e8f0; --merek: #0a7f79; --galat: #b91c1c; }
      @media (prefers-color-scheme: dark) {
        :root { --latar: #020617; --kartu: #0f172a; --teks: #f1f5f9; --redup: #94a3b8; --garis: #1e293b; --merek: #2dd4bf; --galat: #fca5a5; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--latar); color: var(--teks); font: 15px/1.55 system-ui, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 380px; padding: 28px 24px; border: 1px solid var(--garis); border-radius: 20px; background: var(--kartu); text-align: center; }
      .logo { width: 44px; height: 44px; margin: 0 auto 14px; }
      h1 { margin: 0 0 6px; font-size: 18px; }
      p { margin: 0; color: var(--redup); font-size: 14px; }
      body[data-galat] h1 { color: var(--galat); }
      .putar { width: 22px; height: 22px; margin: 18px auto 0; border: 3px solid var(--garis); border-top-color: var(--merek); border-radius: 50%; animation: putar 0.8s linear infinite; }
      @keyframes putar { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .putar { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/icon-192.png" alt="" />
      <h1 id="judul">Menghubungkan ke Microsoft 365…</h1>
      <p id="isi">Sebentar ya, kami membuka halaman masuk Microsoft untuk WiCon.</p>
      <div id="putar" class="putar" role="status" aria-label="Memuat"></div>
    </main>
    <script type="module">
      import { jalankanJendelaMasuk } from "/src/auth/teams.ts";
      void jalankanJendelaMasuk();
    </script>
  </body>
</html>
